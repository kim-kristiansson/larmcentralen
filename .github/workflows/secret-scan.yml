name: Secret scan

# Fails the build if a commit adds something that looks like a key, password or token.
# Real secrets belong in user-secrets or App Service settings (see README, "API keys and secrets").
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
